<div class="ov" id="pick" hidden><h2>Chọn tướng của bạn</h2><div id="cards"></div><section class="step" id="modePick"><h2>Chọn chế độ · Bước 2</h2><p class="stepHint">Chọn tướng ở trên, sau đó chọn kiểu trận đấu.</p><div id="modeButtons"><button class="mbt" id="mode1">1v1<small>Đấu đơn</small></button><button class="mbt" id="mode3">3v3<small>2 đồng minh máy</small></button></div></section><section class="step" id="oppSection" hidden><h2>Chọn đối thủ máy</h2><p id="modeHelp">Chọn chế độ để tiếp tục.</p><div id="opponents"></div></section><button class="bt" id="startFight" hidden>⚔ Bắt đầu trận</button></div>

nam:{n:'Nam',role:'Xạ thủ',col:'#46a7ff',hp:700,atk:70,sp:235,rg:320,cd:.8,r:17,st:[2,5,3],k1:'Tăng tốc đánh',k2:'Mũi tên năng lượng',d:'Bắn tên xuyên thấu tầm xa. K: tăng tốc đánh 4s. L: mũi tên năng lượng tầm cực xa, xuyên thấu, sát thương diện rộng.'},

const TR=[];for(let i=0;i<300;i++){const x=rnd()*W,y=rnd()*H;if(Math.abs(y-LY)<120||Math.hypot(x-1500,y-LY)<310||CPD.concat(EXTRA_CPD).some(c=>Math.hypot(x-c[0],y-c[1])<130)||x<380||x>W-380||Math.abs(x-WX)<45||Math.abs(x-(W-WX))<45||Math.hypot(x-1500,y-(LY+220))<200||nearRoute(x,y,78))continue;TR.push([x,y,16+rnd()*14])}

const ROCKS=[];for(let i=0;i<260;i++){const x=rnd()*W,y=rnd()*H,r=8+rnd()*17;if(freeTerrain(x,y,70)&&!ROCKS.some(q=>Math.hypot(x-q[0],y-q[1])<r+q[2]+42))ROCKS.push([x,y,r,rnd()*6.28])}

const jend=e=>{if(e.pointerId!=jid)return;jid=null;joy.x=joy.y=0;jb.style.display='none';jk.style.transform=''};jz.addEventListener('pointerup',jend);jz.addEventListener('pointercancel',jend);
requestAnimationFrame(loop);
</script></body></html>
